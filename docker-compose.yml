services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avanpost
      POSTGRES_PASSWORD: avanpost
      POSTGRES_DB: avanpost
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avanpost -d avanpost"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
