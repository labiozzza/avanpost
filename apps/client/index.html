<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6f9d52" />
    <title>Аванпост</title>
  </head>
  <body>
    <canvas id="world" aria-label="Поле поселения"></canvas>

    <header id="hud">
      <div class="brand">Аванпост</div>
      <div class="resources" aria-label="Ресурсы">
        <span class="chip">
          <span class="resource-icon log" aria-hidden="true"></span>
          Дерево
          <b data-testid="wood">0</b>
        </span>
        <span class="chip">
          <span class="resource-icon stone" aria-hidden="true"></span>
          Камень
          <b data-testid="stone">0</b>
        </span>
      </div>
        <span class="chip" data-testid="server-status">Сервер: подключение…</span>
        <button
          id="residents-toggle"
          data-testid="residents-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="residents-panel"
        >
          Жители
        </button>
        <button
          id="craft-toggle"
          data-testid="craft-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="craft-panel"
        >
          Ремесло
        </button>
        <button
          id="research-toggle"
          data-testid="research-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="research-panel"
        >
          Наука
        </button>
    </header>

    <div id="status" data-testid="status" role="status">Нажми на дерево</div>

    <aside id="residents-panel" data-testid="residents-panel" aria-label="Жители" hidden>
      <header class="residents-head">
        <span>Жители</span>
        <button id="residents-close" data-testid="residents-close" type="button" aria-label="Закрыть">
          ×
        </button>
      </header>
      <div id="population-status" data-testid="population-status" class="population-status">
        Поселение: —
      </div>
      <ul id="residents-list" data-testid="residents-list" aria-label="Список жителей"></ul>
      <section
        id="resident-detail"
        data-testid="resident-detail"
        aria-label="Карточка жителя"
      ></section>
    </aside>

    <aside id="craft-panel" data-testid="craft-panel" aria-label="Ремесло" hidden>
      <header class="residents-head">
        <span>Ремесло</span>
        <button id="craft-close" data-testid="craft-close" type="button" aria-label="Закрыть">
          ×
        </button>
      </header>
      <div id="craft-status" data-testid="craft-status" class="population-status">
        Мастерская не построена
      </div>
      <ul id="craft-list" data-testid="craft-list" aria-label="Рецепты"></ul>
    </aside>

    <aside id="research-panel" data-testid="research-panel" aria-label="Наука" hidden>
      <header class="residents-head">
        <span>Наука</span>
        <button id="research-close" data-testid="research-close" type="button" aria-label="Закрыть">
          ×
        </button>
      </header>
      <div id="research-status" data-testid="research-status" class="population-status">
        Очки исследования: 0
      </div>
      <label class="research-scholar-label" for="research-scholar">
        Учёный
        <select id="research-scholar" data-testid="research-scholar">
          <option value="">Без учёного</option>
        </select>
      </label>
      <ul id="research-list" data-testid="research-list" aria-label="Технологии"></ul>
    </aside>

    <section id="placement-bar" data-testid="placement-bar" aria-label="Размещение" hidden>
      <span id="placement-title" data-testid="placement-title">Выберите клетку</span>
      <span id="placement-hint" data-testid="placement-hint"></span>
      <button id="placement-confirm" data-testid="placement-confirm" type="button">Поставить</button>
      <button id="placement-cancel" data-testid="placement-cancel" type="button">Отмена</button>
    </section>

    <button
      id="tree-hotspot"
      data-testid="tree"
      type="button"
      aria-label="Дерево"
    ></button>

    <div id="tree-menu" data-testid="tree-menu" hidden>
      <span class="menu-title">Дерево</span>
      <button id="chop" data-testid="chop" type="button">Рубить</button>
    </div>

    <footer id="buildbar" aria-label="Строительство">
      <span class="build-title">Построить</span>
      <button class="build" data-testid="build-house" data-building="house" type="button">
        <span class="build-icon house-icon" aria-hidden="true"></span>
        <span class="build-copy"><strong>Дом</strong><small>3 дерева</small></span>
      </button>
      <button class="build" data-testid="build-storehouse" data-building="storehouse" type="button">
        <span class="build-icon storehouse-icon" aria-hidden="true"></span>
        <span class="build-copy"><strong>Склад</strong><small>Построен</small></span>
      </button>
      <button class="build" data-testid="build-workshop" data-building="workshop" type="button">
        <span class="build-icon workshop-icon" aria-hidden="true"></span>
        <span class="build-copy"><strong>Мастерская</strong><small>Строится сервером</small></span>
      </button>
      <button class="build" data-testid="build-academy" data-building="academy" type="button">
        <span class="build-icon academy-icon" aria-hidden="true"></span>
        <span class="build-copy"><strong>Академия</strong><small>Строится сервером</small></span>
      </button>
    </footer>

    <script type="module" src="/src/phaser/main.ts"></script>
  </body>
</html>
