meta:
  version: 1
  provenance: proposed
  source: "GDD v0.9 §2.2, §3.1, §9.6, §21.3 (I.4), §24.2 (P0)"
  updated: "2026-10-21"

# Население: жильё и миграция. Числа ниже — черновой баланс (proposed),
# требуют настройки на реальной сессии (GDD 2.2, тест 15).
population:
  # Стартовое поселение получает фиксированное число жителей.
  starting_residents: 3
  # Вместимость без построек: стартовый лагерь на три места.
  base_capacity: 3
  # Каждый завершённый дом добавляет столько мест (GDD 3.1, строка 172).
  housing_capacity_per_house: 2
  # Миграция включена: новые жители приходят при свободных местах.
  migration_enabled: true
  # Пауза между прибытиями в тиках (анти-скачок населения).
  migration_min_ticks: 20
  # Роль, которую получает прибывший житель (D2=A: житель = рабочий).
  arrival_laborer_role: carrier

# XP: навыки растут от реальных задач (GDD 2.2, строка 83).
# Точные числа GDD помечены [О]; здесь — черновая быстрая кривая (D3=A).
xp:
  # Опыт за одну завершённую реальную работу (очистка/стройка/добыча).
  xp_per_task: 25
  # Опыт за завершение школы.
  xp_per_school: 60
  # Пороги уровней: сколько всего XP нужно для 2-го, 3-го, 4-го, 5-го уровня.
  level_thresholds: [100, 200, 400, 800]
