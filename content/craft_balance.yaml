meta:
  version: 1
  provenance: proposed
  source: "GDD v0.9 §3.3, §6.1, §24.2 (P0)"
  updated: "2026-10-21"

# Баланс ремесла и исследований. Все значения — целые тики/единицы.
craft:
  # Сколько тиков длится один рабочий цикл на станции по умолчанию,
  # если рецепт не задаёт production_seconds сам.
  default_production_ticks: 8
  # Сколько единиц выхода помещается в буфер станции до того, как их унесёт перевозчик.
  buffer_capacity: 20

research:
  enabled: true
  # Research Points, которые академия с назначенным учёным даёт за тик.
  points_per_tick: 1
  # Сколько RP нужно на один узел дерева по умолчанию (узел может переопределить).
  default_node_cost: 20
  # Максимум одновременно исследуемых проектов на старте (растёт с уровнем академии — этап II).
  max_parallel_projects: 1
